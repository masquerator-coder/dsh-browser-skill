packages:
  - .

# The published dsh-client-ui-primitives entry imports packages it lists only as
# devDependencies upstream (or not at all), so the published manifest is missing
# every runtime dependency of its own `lib/index.js`. Declaring them here lets
# the test transform pipeline resolve them; without this the client suites fail
# on `clsx`, `shiki/engine/javascript`, and friends.
# The published @deepseek-ai packages below import runtime dependencies their
# own manifests never declare (the entries were stripped, or listed only as
# devDependencies upstream), so pnpm cannot resolve them for the test transform
# pipeline. Declaring them here repairs the manifests without forking them.
# Verified by scripts/audit-host-deps.mjs — rerun it after a host bump.
packageExtensions:
  "@deepseek-ai/dsh-client-store@0.2.0-rc.2":
    dependencies:
      "immer": "^10.1.1"
      "zustand": "^5.0.2"
  "@deepseek-ai/dsh-client-ui-primitives@0.2.0-rc.2":
    dependencies:
      "@shikijs/langs": "^4.3.1"
      "anser": "^2.3.5"
      "clsx": "^2.0.0"
      "diff": "^8.0.2"
      "katex": "^0.16.47"
      "mdast-util-from-markdown": "^2.0.3"
      "mdast-util-gfm": "^3.1.0"
      "mdast-util-math": "^3.0.0"
      "micromark-core-commonmark": "^2.0.3"
      "micromark-extension-gfm": "^3.0.0"
      "micromark-extension-math": "^3.1.0"
      "micromark-factory-space": "^2.0.1"
      "micromark-util-character": "^2.1.1"
      "micromark-util-classify-character": "^2.0.1"
      "micromark-util-sanitize-uri": "^2.0.1"
      "micromark-util-symbol": "^2.0.1"
      "shiki": "^4.3.1"
      "simple-icons": "^15.0.0"
    peerDependencies:
      react: "^18.2.0"
      react-dom: "^18.2.0"